    <!--
      Google Tag Manager, GTM-K6PBWCCT. Google's standard container snippet,
      not the gtm.js-plus-gtag hybrid it was sent as: that skipped the gtm.js
      event, so page-view triggers in the container would never fire. The
      container itself sends to AW-18571334508; it sits alongside the
      AW-18526184031 tag below rather than replacing it, because the Contact
      conversion belongs to that account and is not in the container.
    -->
    <script>
      ;(function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-K6PBWCCT')
    </script>

    <!--
      Google Ads tag (gtag.js), AW-18526184031. It replaces AW-18407581580.

      It sits high in the head on purpose, and it is not gated to production:
      a hostname guard would keep a handful of localhost page views out of the
      account, but it would also stop Tag Assistant firing during development,
      which is the worse trade.

      The Contact conversion is not fired here. Google's snippet fires it on
      page load, which on a one-page site would count every visitor as a
      contact. It is fired from the phone, WhatsApp and Telegram links instead -
      see ContactLinks.jsx.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18526184031"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())

      gtag('config', 'AW-18526184031')
    </script>
